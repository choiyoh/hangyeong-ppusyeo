name: Deploy game assets
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-game.yml"
      - ".github/payloads/**"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode payloads into game.js and style.css
        run: |
          python3 << 'PY'
          import base64, gzip, pathlib
          root = pathlib.Path(".github/payloads")
          mapping = {
            "game.js": root / "game.js.gz.b64",
            "style.css": root / "style.css.gz.b64",
          }
          for out, src in mapping.items():
            raw = gzip.decompress(base64.b64decode(src.read_text()))
            pathlib.Path(out).write_bytes(raw)
            text = raw.decode()
            if out == "game.js":
              assert "dragGhost" in text and "onPointerMove" in text and "swipeThreshold" in text
            else:
              assert ".drag-ghost" in text and ".burst-dust" in text
            print("wrote", out, len(raw), "bytes")
          PY
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js style.css
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "Drag ghost swipe + stronger per-planet burst FX"
          git push
