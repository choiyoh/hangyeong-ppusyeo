name: decode-css
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode style.css from base64 gzip parts
        run: |
          set -euo pipefail
          # Repair known single-char MCP corruption in part2 if present
          sed -i 's/kHepfPRw+3uPt+f3Nh+d/kHepfPRw+8uPt+f3Nh+d/' .github/payloads/style.part2.b64
          cat .github/payloads/style.part1.b64 .github/payloads/style.part2.b64 | tr -d '\n' | base64 -d | gzip -dc > style.css
          test -s style.css
          bytes=$(wc -c < style.css)
          echo "decoded bytes=$bytes"
          grep -F '골드 막대' style.css
          grep -F '양끝 꼬인' style.css
          ! grep -F 'FILE_CONTENT' style.css
          test "$bytes" -ge 30000 -a "$bytes" -le 32000
      - name: Commit decoded CSS and remove payload + workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/payloads/style.part1.b64 .github/payloads/style.part2.b64
          rmdir .github/payloads 2>/dev/null || true
          rm -f .github/workflows/decode-css.yml
          git add -A style.css .github || true
          git add -u
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "style: special silhouettes (gold bar, star, gem, candy twist)"
          git push
