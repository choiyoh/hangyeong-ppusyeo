name: decode-restart
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode game.js and style.css from gzip base64
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import base64, gzip, hashlib, pathlib
          def dec(parts, dest, expect):
              data = "".join("".join(pathlib.Path(p).read_text().split()) for p in parts)
              raw = gzip.decompress(base64.b64decode(data))
              digest = hashlib.sha256(raw).hexdigest()
              if digest != expect:
                  raise SystemExit(f"{dest} sha mismatch {digest}")
              if b"FILE_CONTENT" in raw:
                  raise SystemExit(f"{dest} has FILE_CONTENT placeholder")
              pathlib.Path(dest).write_bytes(raw)
              print(dest, len(raw), digest)
          dec(
              [".github/payloads/game.js.part1.b64", ".github/payloads/game.js.part2.b64"],
              "game.js",
              "50db28a271c0ddc787e334899cd43f496f036f03f9318a4e567e773534eaa25d",
          )
          dec(
              [".github/payloads/style.css.part1.b64", ".github/payloads/style.css.part2.b64"],
              "style.css",
              "a931e6c50564c7a53556f98cf7cf31aa0b10b4fbd67c6da89d2179e366925181",
          )
          html = pathlib.Path("index.html").read_bytes()
          h = hashlib.sha256(html).hexdigest()
          expect_html = "ae82cd214dfdcc2470445777da2a115a0a70aa4ab0945fe3e86cb8093c8cc99a"
          if h != expect_html:
              raise SystemExit(f"index.html sha mismatch {h}")
          js = pathlib.Path("game.js").read_text()
          css = pathlib.Path("style.css").read_text()
          html_t = html.decode()
          for needle in (
              'restartBtn.addEventListener("click", retryStage)',
              'full-restart',
              "function retryStage()",
              "function fullRestart()",
          ):
              if needle not in js:
                  raise SystemExit("missing in game.js: " + needle)
          if 'restartBtn.addEventListener("click", fullRestart)' in js:
              raise SystemExit("HUD restart still calls fullRestart")
          for needle in (".btn-ghost", ".actions"):
              if needle not in css:
                  raise SystemExit("missing in style.css: " + needle)
          for needle in ('id="full-restart"', "처음부터", 'id="restart"'):
              if needle not in html_t:
                  raise SystemExit("missing in index.html: " + needle)
          print("verified")
          PY
      - name: Commit decoded files and remove payload + workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .github/payloads
          rm -f .github/workflows/decode-restart.yml
          git add game.js style.css index.html
          git add -u .github
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "HUD restart retries the current stage"
          git push
