name: Apply wrap double-blast fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode game.js
        run: |
          python3 -c "import base64,gzip,pathlib; pathlib.Path('game.js').write_bytes(gzip.decompress(base64.b64decode(pathlib.Path('game.js.gz.b64').read_text().strip())))"
          wc -c game.js
          grep -c wrapCenters game.js
          grep -c applyGravity game.js
          ! grep -q 'spawnSpecialFx(wrapFx)' game.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix wrap double-blast: second 3x3 clear + gravity after fall"
          git push
