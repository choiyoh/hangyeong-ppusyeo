name: Decode wrap assets once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode gzip payloads into game.js and style.css
        run: |
          set -euo pipefail
          python3 << 'PY'
          import pathlib, base64, gzip, sys
          root = pathlib.Path('.')
          def restore(out_name, prefix):
              parts = sorted(root.glob(prefix + '*'))
              if not parts:
                  print('MISSING parts for', prefix, file=sys.stderr)
                  sys.exit(1)
              b64 = ''.join(p.read_text().strip() for p in parts)
              data = gzip.decompress(base64.b64decode(b64))
              root.joinpath(out_name).write_bytes(data)
              text = data.decode('utf-8')
              print(out_name, 'bytes', len(data))
              if out_name == 'game.js':
                  for needle in ('findLTShapes', 'special-wrap', 'dragGhost', 'WRAP_BEAT_MS'):
                      if needle not in text:
                          print('MISSING marker', needle, file=sys.stderr)
                          sys.exit(2)
                      print('ok', needle)
                  if 'FILE_CONTENT' in text or 'PLACEHOLDER' in text:
                      print('BAD placeholder content', file=sys.stderr)
                      sys.exit(3)
              if out_name == 'style.css':
                  for needle in ('special-wrap', 'punch-wrap', 'fx-wrap'):
                      if needle not in text:
                          print('MISSING css', needle, file=sys.stderr)
                          sys.exit(4)
                      print('ok', needle)
              for p in parts:
                  p.unlink()
                  print('deleted', p)
          restore('game.js', 'game.js.payload.b64.')
          restore('style.css', 'style.css.payload.b64.')
          PY
      - name: Commit restored assets and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/decode-wrap.yml
          rm -f .github/workflows/restore-once.yml
          rm -f game.js.payload.b64.* style.css.payload.b64.* || true
          git add -A game.js style.css
          git add -u .github/workflows/ || true
          git add -u game.js.payload.b64.* style.css.payload.b64.* 2>/dev/null || true
          git status
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Ship L/T wrap specials (findLTShapes + double-pulse)"
          git push
