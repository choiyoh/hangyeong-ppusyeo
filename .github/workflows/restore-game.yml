name: Restore game.js
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-game.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and write game.js
        run: |
          python3 << 'PY'
          import base64, gzip
          b64 = """"""
          raw = gzip.decompress(base64.b64decode(b64))
          open("game.js","wb").write(raw)
          text = raw.decode()
          assert "SWIPE_PX" in text and "onPointerDown" in text
          print("wrote", len(raw), "bytes")
          PY
      - name: Commit game.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "Add swipe-to-swap input (keep tap-tap)"
          git push
